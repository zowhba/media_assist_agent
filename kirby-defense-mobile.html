<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>별의 커비 디펜스 모바일 — 가챠 에디션</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Apple SD Gothic Neo','Malgun Gothic','Trebuchet MS',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
.hidden{display:none!important}

#topbar{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:center;width:100%;padding:0 8px;pointer-events:none}
.chip{background:rgba(255,255,255,.92);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;color:#5a4a6a;box-shadow:0 3px 9px rgba(90,60,120,.18);white-space:nowrap}
#mapChip{background:rgba(90,60,120,.55);color:#fff}

#towerbar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:8px;z-index:5;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
#towerbar::-webkit-scrollbar{display:none}
.card{flex:0 0 78px;background:rgba(255,255,255,.94);border-radius:14px;padding:7px 4px;text-align:center;cursor:pointer;border:3px solid transparent;box-shadow:0 4px 10px rgba(90,60,120,.2);transition:transform .12s,border-color .12s;position:relative}
.card.sel{border-color:#ff7eb3;transform:translateY(-5px)}
.card.poor{opacity:.45;filter:grayscale(.6)}
.avatar{width:36px;height:36px;border-radius:50%;margin:0 auto 4px;box-shadow:inset -3px -5px 7px rgba(0,0,0,.13)}
.cname{font-weight:800;color:#5a4a6a;font-size:11px;white-space:nowrap}
.cost{color:#e8a000;font-weight:800;font-size:11px}
.lv{position:absolute;top:-7px;right:-5px;background:#ff7eb3;color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:2px 6px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.rbadge{position:absolute;top:-7px;left:-5px;color:#fff;font-size:9px;font-weight:900;border-radius:6px;padding:2px 5px}

#bottombar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:5;gap:8px}
.bigbtn{border:none;border-radius:999px;font-weight:900;font-size:15px;padding:12px 18px;cursor:pointer;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.25);transition:transform .1s}
.bigbtn:active{transform:scale(.94)}
#gachaBtn{background:linear-gradient(#b88af0,#8a5ae0)}
#speedBtn{background:linear-gradient(#7ec8f0,#4a9ae0);padding:12px 14px}
#startBtn{background:linear-gradient(#ff9ec3,#ff7eb3);flex:1;max-width:230px}

#banner{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;background:rgba(255,255,255,.95);color:#e85d9e;font-weight:900;font-size:16px;padding:8px 20px;border-radius:999px;box-shadow:0 5px 15px rgba(90,60,120,.25);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:94vw}
#redflash{position:fixed;inset:0;background:radial-gradient(transparent 55%,rgba(255,60,80,.55));opacity:0;pointer-events:none;z-index:8;transition:opacity .5s}

#overlay{position:fixed;inset:0;background:rgba(70,40,90,.5);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
#overlayCard{background:#fff;border-radius:24px;padding:26px 24px;text-align:center;max-width:420px;box-shadow:0 18px 45px rgba(0,0,0,.35)}
#overlayCard h1{color:#e85d9e;font-size:24px;margin-bottom:10px}
#overlayCard p{color:#7a6a8a;font-size:14px;line-height:1.7;margin-bottom:16px}
#overlayCard button{background:linear-gradient(#ff9ec3,#ff7eb3);border:none;color:#fff;font-size:16px;font-weight:900;padding:12px 30px;border-radius:999px;cursor:pointer;box-shadow:0 5px 14px rgba(255,126,179,.5)}

/* ---------- 가챠 ---------- */
#gachaModal{position:fixed;inset:0;background:rgba(40,25,60,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
#gachaCard{background:linear-gradient(#fff6fb,#f3eaff);border-radius:24px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;padding:18px;box-shadow:0 18px 45px rgba(0,0,0,.4)}
.g-head{display:flex;align-items:center;justify-content:space-between;font-weight:900;color:#7a4ae0;font-size:18px;margin-bottom:8px}
#gachaClose{border:none;background:#eee;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;color:#888;font-weight:900}
#gachaStage{min-height:140px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:8px 0}
.g-star{font-size:72px;animation:shake .7s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-12deg) scale(1)}25%{transform:rotate(10deg) scale(1.12)}50%{transform:rotate(-9deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.15)}}
.g-result{width:86px;background:#fff;border-radius:14px;padding:10px 4px;text-align:center;animation:popIn .45s cubic-bezier(.2,1.6,.4,1) backwards;position:relative;border:3px solid var(--rc,#ccc);box-shadow:0 0 14px var(--rc,#ccc)}
@keyframes popIn{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.g-result .avatar{width:42px;height:42px}
.g-result .rname{font-weight:900;font-size:11px;color:#5a4a6a;margin-top:3px;white-space:nowrap}
.g-result .rrar{font-weight:900;font-size:11px;color:var(--rc)}
.g-result .rnew{position:absolute;top:-9px;right:-7px;background:#ff5577;color:#fff;font-size:9px;font-weight:900;border-radius:999px;padding:2px 6px}
.g-btns{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.g-btns button{flex:1;border:none;border-radius:14px;padding:12px 6px;font-weight:900;font-size:14px;color:#fff;background:linear-gradient(#b88af0,#8a5ae0);cursor:pointer;box-shadow:0 4px 10px rgba(138,90,224,.4)}
.g-btns button:disabled{opacity:.45}
#collection{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.col-item{background:#fff;border-radius:12px;padding:8px 2px;text-align:center;position:relative}
.col-item .avatar{width:34px;height:34px}
.col-item .cn{font-size:10px;font-weight:800;color:#5a4a6a;margin-top:2px;white-space:nowrap}
.col-item.locked{opacity:.5}
.col-item.locked .avatar{filter:grayscale(1) brightness(.35)}
.g-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9a8ab0}
#resetSave{border:none;background:none;color:#c0a0d0;font-size:11px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="topbar">
  <div class="chip">❤️ <span id="lives">12</span></div>
  <div class="chip">⭐ <span id="gold">140</span></div>
  <div class="chip">💎 <span id="gems">120</span></div>
  <div class="chip" id="waveLabel">WAVE 준비</div>
  <div class="chip" id="mapChip">🗺️ 푸른 초원</div>
</div>
<div id="towerbar"></div>
<div id="bottombar">
  <button id="gachaBtn" class="bigbtn">🎁 뽑기</button>
  <button id="startBtn" class="bigbtn">▶ WAVE 1</button>
  <button id="speedBtn" class="bigbtn">x1</button>
</div>
<div id="banner"></div>
<div id="redflash"></div>

<div id="overlay">
  <div id="overlayCard">
    <h1>🌟 별의 커비 디펜스</h1>
    <p><b>10개의 웨이브</b>가 4가지 맵을 넘나들며 몰려옵니다!<br>
    💎로 <b>캐릭터 뽑기</b>를 해서 새로운 친구를 모으고,<br>
    중복으로 뽑으면 <b>레벨업</b>! 컬렉션은 자동 저장돼요.<br>
    카드를 고른 뒤 맵을 탭해서 배치하세요 🎀</p>
    <button id="overlayBtn">게임 시작!</button>
  </div>
</div>

<div id="gachaModal" class="hidden">
  <div id="gachaCard">
    <div class="g-head"><span>🎁 캐릭터 뽑기</span><span style="font-size:14px">💎 <span id="gemLabel">0</span></span><button id="gachaClose">✕</button></div>
    <div id="gachaStage"><div style="color:#b0a0c8;font-size:13px">버튼을 눌러 친구를 뽑아보세요!</div></div>
    <div class="g-btns">
      <button id="pull1">1회 뽑기<br>💎 50</button>
      <button id="pull5">5회 뽑기<br>💎 225</button>
    </div>
    <div id="collection"></div>
    <div class="g-foot"><span id="pityLabel"></span><button id="resetSave">저장 초기화</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= 렌더러 / 카메라 ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8e3ff);
scene.fog = new THREE.Fog(0xb8e3ff, 38, 80);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 220);
function fitCamera(){
  const a = innerWidth/innerHeight;
  const k = Math.max(0.8, Math.min(1.4, 0.66/a));
  camera.position.set(0, 28*k, 24*k);
  camera.lookAt(0, 0, 1);
}
fitCamera();

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xfff6e8, 0x88c070, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 0.5);
sun.position.set(7, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24;
scene.add(sun);

/* ================= 헬퍼 ================= */
function toonMat(c){ return new THREE.MeshToonMaterial({color:c}); }
function mesh(geo, color){ const m = new THREE.Mesh(geo, toonMat(color)); m.castShadow = true; return m; }
function ball(r, c, sx=1, sy=1, sz=1, seg=18){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), toonMat(c));
  m.scale.set(sx, sy, sz); m.castShadow = true; return m;
}
function at(m, x, y, z){ m.position.set(x, y, z); return m; }
function v(x, y, z){ return new THREE.Vector3(x, y, z); }

function makeStarGeo(outer, inner){
  const s = new THREE.Shape();
  for(let i=0;i<10;i++){
    const r = i%2===0 ? outer : inner;
    const a = i/10*Math.PI*2 - Math.PI/2;
    i===0 ? s.moveTo(Math.cos(a)*r, Math.sin(a)*r) : s.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth: outer*0.35, bevelEnabled:false});
  g.center(); return g;
}
const starGeoSmall = makeStarGeo(0.22, 0.1);
const starGeoTiny  = makeStarGeo(0.12, 0.05);
const matCache = {};
function projMat(c){ if(!matCache[c]) matCache[c] = new THREE.MeshBasicMaterial({color:c}); return matCache[c]; }

/* ================= 사운드 ================= */
let AC = null;
function ensureAC(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
}
function sfx(f0, f1, dur, type='triangle', vol=0.05){
  if(!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+dur);
}
function jingle(notes, step=130, vol=0.07){
  notes.forEach((f,i)=>setTimeout(()=>sfx(f, f, 0.18, 'triangle', vol), i*step));
}

/* ================= 캐릭터 모델 ================= */
function makeKirby(){
  const g = new THREE.Group(), pink = 0xff9ec3;
  g.add(at(ball(0.55, pink), 0, 0.58, 0));
  g.add(at(ball(0.2, pink), -0.52, 0.75, 0.1), at(ball(0.2, pink), 0.52, 0.75, 0.1));
  g.add(at(ball(0.21, 0xd23b6d, 1.15, 0.6, 1.3), -0.27, 0.12, 0.06));
  g.add(at(ball(0.21, 0xd23b6d, 1.15, 0.6, 1.3), 0.27, 0.12, 0.06));
  g.add(at(ball(0.075, 0x1b2a4a, 1, 2.1, 0.5), -0.18, 0.74, 0.5));
  g.add(at(ball(0.075, 0x1b2a4a, 1, 2.1, 0.5), 0.18, 0.74, 0.5));
  g.add(at(ball(0.032, 0xffffff), -0.17, 0.82, 0.52), at(ball(0.032, 0xffffff), 0.17, 0.82, 0.52));
  g.add(at(ball(0.075, 0xff6fa5, 1, 0.55, 0.35), -0.36, 0.55, 0.42));
  g.add(at(ball(0.075, 0xff6fa5, 1, 0.55, 0.35), 0.36, 0.55, 0.42));
  g.add(at(ball(0.05, 0x8b1e3f, 1.5, 1, 0.4), 0, 0.47, 0.54));
  return g;
}
function makeWaddleDee(bandana){
  const g = new THREE.Group(), body = 0xe07b39;
  g.add(at(ball(0.46, body), 0, 0.5, 0));
  g.add(at(ball(0.34, 0xfbd99e, 1.05, 0.82, 0.55), 0, 0.48, 0.3));
  g.add(at(ball(0.055, 0x222222, 1, 1.9, 0.5), -0.14, 0.6, 0.48));
  g.add(at(ball(0.055, 0x222222, 1, 1.9, 0.5), 0.14, 0.6, 0.48));
  g.add(at(ball(0.18, 0xcf6420, 1.1, 0.6, 1.25), -0.23, 0.1, 0.05));
  g.add(at(ball(0.18, 0xcf6420, 1.1, 0.6, 1.25), 0.23, 0.1, 0.05));
  g.add(at(ball(0.15, body), -0.43, 0.55, 0.08), at(ball(0.15, body), 0.43, 0.55, 0.08));
  if(bandana){
    g.add(at(ball(0.42, 0x2e6fe0, 1.08, 0.42, 1.08), 0, 0.88, 0));
    g.add(at(ball(0.1, 0x2e6fe0, 0.7, 1.6, 0.5), 0, 0.78, -0.45));
    const spear = new THREE.Group();
    spear.add(mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.3, 8), 0x9a6a3a));
    spear.add(at(mesh(new THREE.ConeGeometry(0.09, 0.26, 10), 0xd8dde8), 0, 0.75, 0));
    spear.position.set(0.52, 0.62, 0.15);
    spear.rotation.z = -0.22;
    g.add(spear);
  }
  return g;
}
function makeWaddleDoo(){
  const g = new THREE.Group(), body = 0xd96a2e;
  g.add(at(ball(0.46, body), 0, 0.5, 0));
  g.add(at(ball(0.17, 0xffffff, 1, 1.5, 0.6), 0, 0.58, 0.42));
  g.add(at(ball(0.09, 0x3d6ff2, 1, 1.5, 0.6), 0, 0.58, 0.48));
  g.add(at(ball(0.045, 0x111111, 1, 1.5, 0.6), 0, 0.58, 0.52));
  g.add(at(ball(0.18, 0xb5521f, 1.1, 0.6, 1.25), -0.23, 0.1, 0.05));
  g.add(at(ball(0.18, 0xb5521f, 1.1, 0.6, 1.25), 0.23, 0.1, 0.05));
  g.add(at(ball(0.14, body), -0.42, 0.55, 0.08), at(ball(0.14, body), 0.42, 0.55, 0.08));
  return g;
}
function makeBrontoBurt(){
  const g = new THREE.Group(), pink = 0xf06fb8;
  g.add(at(ball(0.42, pink), 0, 0.45, 0));
  g.add(at(ball(0.11, 0xffffff, 1, 1.7, 0.5), -0.14, 0.52, 0.39));
  g.add(at(ball(0.11, 0xffffff, 1, 1.7, 0.5), 0.14, 0.52, 0.39));
  g.add(at(ball(0.045, 0x222222, 1, 1.5, 0.5), -0.14, 0.52, 0.46));
  g.add(at(ball(0.045, 0x222222, 1, 1.5, 0.5), 0.14, 0.52, 0.46));
  g.add(at(ball(0.12, 0xc94d92, 1, 0.7, 1), -0.15, 0.02, 0.05));
  g.add(at(ball(0.12, 0xc94d92, 1, 0.7, 1), 0.15, 0.02, 0.05));
  const wings = [];
  for(const s of [-1, 1]){
    const wg = new THREE.Group();
    wg.position.set(0.2*s, 0.78, -0.18);
    const wm = ball(0.3, 0xf0f6ff, 0.45, 1.15, 0.16);
    wm.position.set(0.12*s, 0.3, 0);
    wg.add(wm);
    wg.userData.side = s;
    g.add(wg); wings.push(wg);
  }
  g.userData.wings = wings;
  return g;
}
function makeMetaKnight(){
  const g = new THREE.Group();
  g.add(at(ball(0.5, 0x3b3f9e), 0, 0.55, 0));
  g.add(at(ball(0.5, 0xcfd6e4, 1.02, 0.92, 0.55), 0, 0.57, 0.26));
  const eyeMat = new THREE.MeshBasicMaterial({color:0xffe066});
  for(const s of [-1, 1]){
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 14, 14), eyeMat);
    e.scale.set(1, 1.9, 0.5); e.position.set(0.16*s, 0.62, 0.54);
    g.add(e);
  }
  g.add(at(ball(0.16, 0x6a5acd), -0.46, 0.85, 0), at(ball(0.16, 0x6a5acd), 0.46, 0.85, 0));
  const cape = mesh(new THREE.ConeGeometry(0.52, 1.15, 16), 0x4b2a6e);
  cape.position.set(0, 0.55, -0.34);
  cape.rotation.x = -0.28;
  g.add(cape);
  g.add(at(ball(0.17, 0x5b3a8e, 1.1, 0.6, 1.25), -0.22, 0.1, 0.06));
  g.add(at(ball(0.17, 0x5b3a8e, 1.1, 0.6, 1.25), 0.22, 0.1, 0.06));
  const sword = new THREE.Group();
  sword.add(at(mesh(new THREE.BoxGeometry(0.07, 0.85, 0.03), 0xffd24a), 0, 0.42, 0));
  sword.add(mesh(new THREE.BoxGeometry(0.24, 0.06, 0.06), 0xc9a227));
  sword.position.set(0.58, 0.62, 0.1);
  sword.rotation.z = -0.5;
  g.add(sword);
  return g;
}
function makeDedede(){
  const g = new THREE.Group();
  g.add(at(ball(0.95, 0x4169d0, 1, 1.05, 0.92), 0, 1.0, 0));
  g.add(at(ball(0.62, 0xfff0c2, 0.95, 0.95, 0.5), 0, 0.85, 0.62));
  const beakU = mesh(new THREE.ConeGeometry(0.2, 0.55, 14), 0xf5c542);
  beakU.rotation.x = Math.PI/2; beakU.position.set(0, 1.28, 1.0);
  const beakL = mesh(new THREE.ConeGeometry(0.15, 0.4, 14), 0xe0a82e);
  beakL.rotation.x = Math.PI/2; beakL.position.set(0, 1.08, 0.95);
  g.add(beakU, beakL);
  g.add(at(ball(0.13, 0xffffff, 1, 1.6, 0.5), -0.22, 1.52, 0.78));
  g.add(at(ball(0.13, 0xffffff, 1, 1.6, 0.5), 0.22, 1.52, 0.78));
  g.add(at(ball(0.055, 0x222222, 1, 1.6, 0.5), -0.22, 1.52, 0.86));
  g.add(at(ball(0.055, 0x222222, 1, 1.6, 0.5), 0.22, 1.52, 0.86));
  const hat = mesh(new THREE.ConeGeometry(0.55, 0.9, 18), 0xe04848);
  hat.position.set(0, 2.35, 0);
  const rim = mesh(new THREE.TorusGeometry(0.5, 0.11, 10, 24), 0xffffff);
  rim.rotation.x = Math.PI/2; rim.position.set(0, 1.95, 0);
  g.add(hat, rim, at(ball(0.16, 0xffffff), 0, 2.85, 0));
  g.add(at(ball(0.28, 0xe04848), -0.85, 1.05, 0.2), at(ball(0.28, 0xe04848), 0.85, 1.05, 0.2));
  g.add(at(ball(0.18, 0xffe9c0), -1.0, 0.9, 0.35), at(ball(0.18, 0xffe9c0), 1.0, 0.9, 0.35));
  g.add(at(ball(0.3, 0xf5c542, 1.2, 0.5, 1.5), -0.4, 0.13, 0.1));
  g.add(at(ball(0.3, 0xf5c542, 1.2, 0.5, 1.5), 0.4, 0.13, 0.1));
  const hammer = new THREE.Group();

/* ================= 맵 구성 ================= */
let mapGroup = null, curve = null, curveLen = 1, pathPts = [], ground = null;
const mapClouds = [], mapSpinners = [];

function buildMap(idx){
  currentMap = idx;
  const M = MAPS[idx];
  if(mapGroup) scene.remove(mapGroup);
  mapGroup = new THREE.Group();
  scene.add(mapGroup);
  mapClouds.length = 0; mapSpinners.length = 0;

  scene.background.setHex(M.sky);
  scene.fog.color.setHex(M.sky);
  hemi.intensity = M.hemi;
  sun.intensity = M.sun;
  $('mapChip').textContent = '🗺️ ' + M.name;

  ground = new THREE.Mesh(new THREE.PlaneGeometry(24, 38), toonMat(M.ground));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  mapGroup.add(ground);

  curve = new THREE.CatmullRomCurve3(M.pts.map(p=>v(p[0], 0, p[1])));
  curveLen = curve.getLength();
  pathPts = curve.getSpacedPoints(220);

  // 길 리본
  const N = 170, w = 1.5, pos = [], idx2 = [];
  for(let i=0;i<=N;i++){
    const t = i/N, p = curve.getPointAt(t), tg = curve.getTangentAt(t);
    const nx = -tg.z, nz = tg.x;
    pos.push(p.x+nx*w/2, 0.03, p.z+nz*w/2,  p.x-nx*w/2, 0.03, p.z-nz*w/2);
  }
  for(let i=0;i<N;i++){ const a=i*2; idx2.push(a, a+2, a+1,  a+1, a+2, a+3); }
  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  rg.setIndex(idx2); rg.computeVertexNormals();
  const road = new THREE.Mesh(rg, toonMat(M.road));
  road.receiveShadow = true;
  mapGroup.add(road);

  // 골인 별
  const goalStar = mesh(makeStarGeo(0.8, 0.38), 0xffd24a);
  const gp = curve.getPointAt(0.93);
  goalStar.position.set(gp.x, 1.5, gp.z);
  mapGroup.add(goalStar);
  mapSpinners.push(goalStar);
  const gb = mesh(new THREE.CylinderGeometry(0.45, 0.65, 0.5, 16), 0xffe9b0);
  gb.position.set(gp.x, 0.25, gp.z);
  mapGroup.add(gb);

  // 장식물
  function decoSpot(){
    for(let t=0;t<40;t++){
      const p = v((Math.random()*2-1)*11, 0, (Math.random()*2-1)*18);
      if(distToPath(p) > 2.2 && p.distanceTo(v(gp.x,0,gp.z)) > 2) return p;
    }
    return null;
  }
  for(let i=0;i<10;i++){
    const p = decoSpot();
    if(!p) continue;
    let d;
    if(M.deco==='tree'){
      d = new THREE.Group();
      d.add(at(mesh(new THREE.CylinderGeometry(0.16,0.22,0.7,10), 0x9a6a4a), 0, 0.35, 0));
      d.add(at(ball(0.62, 0x6fc46f), 0, 1.15, 0));
      d.add(at(ball(0.45, 0x8fd98f), 0.38, 1.5, 0.1));
      d.add(at(ball(0.4, 0x5fb45f), -0.36, 1.45, -0.1));
    } else if(M.deco==='palm'){
      d = new THREE.Group();
      const trunk = mesh(new THREE.CylinderGeometry(0.1,0.16,1.5,10), 0xb08050);
      trunk.position.y = 0.75; trunk.rotation.z = 0.12;
      d.add(trunk);
      for(let k=0;k<5;k++){
        const lg = new THREE.Group();
        lg.position.set(0.18, 1.5, 0);
        lg.rotation.y = k/5*Math.PI*2;
        const leaf = ball(0.45, 0x4fae5f, 1.6, 0.18, 0.5);
        leaf.position.set(0.5, 0, 0);
        leaf.rotation.z = -0.35;
        lg.add(leaf);
        d.add(lg);
      }
    } else if(M.deco==='snow'){
      d = new THREE.Group();
      d.add(at(mesh(new THREE.CylinderGeometry(0.12,0.18,0.5,10), 0x8a6a5a), 0, 0.25, 0));
      d.add(at(mesh(new THREE.ConeGeometry(0.6, 1.0, 12), 0x7ab890), 0, 1.0, 0));
      d.add(at(mesh(new THREE.ConeGeometry(0.45, 0.8, 12), 0xeef6ff), 0, 1.6, 0));
    } else {
      d = new THREE.Group();
      const h = 0.6 + Math.random()*1.0;
      d.add(at(mesh(new THREE.ConeGeometry(0.28, h, 6), 0xb89af0), 0, h/2, 0));
      if(Math.random()<0.5){
        const st = mesh(makeStarGeo(0.3, 0.14), 0xffe066);
        st.position.y = h + 0.4;
        d.add(st);
        mapSpinners.push(st);
      }
    }
    d.position.copy(p);
    d.scale.setScalar(0.8 + Math.random()*0.4);
    d.rotation.y = Math.random()*Math.PI*2;
    mapGroup.add(d);
  }
  // 바닥 점 장식
  for(let i=0;i<30;i++){
    const p = v((Math.random()*2-1)*11, 0.07, (Math.random()*2-1)*18);
    if(distToPath(p) < 1.4) continue;
    const f = ball(0.08, M.dot[i%4]);
    f.castShadow = false;
    f.position.copy(p);
    mapGroup.add(f);
  }
  // 구름
  for(let i=0;i<5;i++){
    const c = new THREE.Group();
    const cm = new THREE.MeshToonMaterial({color:M.cloud});
    [[0,0,0,0.85],[0.9,0.15,0.1,0.6],[-0.85,0.1,-0.1,0.55]].forEach(s=>{
      const b = new THREE.Mesh(new THREE.SphereGeometry(s[3],14,10), cm);
      b.position.set(s[0],s[1],s[2]); c.add(b);
    });
    c.position.set((Math.random()*2-1)*14, 7+Math.random()*3, -8-Math.random()*8);
    c.scale.setScalar(0.7+Math.random()*0.7);
    mapGroup.add(c); mapClouds.push(c);
  }
}
function distToPath(p){
  let d = 1e9;
  for(const q of pathPts){
    const dx = p.x-q.x, dz = p.z-q.z, dd = dx*dx+dz*dz;
    if(dd<d) d = dd;
  }
  return Math.sqrt(d);
}

  selected = key;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel', c.dataset.key===key));
  if(ghost){ scene.remove(ghost); ghost = null; }
  if(key){ ghost = makeGhost(CHARS[key]); ghost.visible = false; scene.add(ghost); }
}

/* ================= 입력 (터치/마우스) ================= */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function groundPoint(cx, cy){
  if(!ground) return null;
  mouse.x = (cx/innerWidth)*2-1;
  mouse.y = -(cy/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(ground);
  return hit.length ? hit[0].point : null;
}
function isValid(p){
  if(!selected) return false;
  if(Math.abs(p.x) > 10.5 || Math.abs(p.z) > 17) return false;
  const d = distToPath(p);
  if(d < 1.3 || d > 5.2) return false;
  for(const t of towers) if(t.pos.distanceTo(p) < 1.4) return false;
  if(gold < CHARS[selected].cost) return false;
  return true;
}
window.addEventListener('pointermove', ev=>{
  if(!ghost) return;
  const p = groundPoint(ev.clientX, ev.clientY);
  if(!p){ ghost.visible = false; return; }
  ghost.visible = true;
  ghost.position.set(p.x, 0, p.z);
  const c = isValid(p) ? 0x42c462 : 0xe05555;
  ghost.userData.ring.material.color.setHex(c);
  ghost.userData.body.material.color.setHex(c);
});
renderer.domElement.addEventListener('pointerdown', ev=>{
  ensureAC();
  if(ev.button !== 0) return;
  const p = groundPoint(ev.clientX, ev.clientY);
  if(!p) return;
  if(selected){
    if(isValid(p)) placeTower(p);
    else { invalidFlash(p); sfx(180, 120, 0.12, 'square', 0.04); }
  } else {
    // 배치된 타워를 탭하면 사거리 표시
    for(const t of towers){
      if(t.pos.distanceTo(p) < 0.9){ showRangeRing(t); break; }
    }
  }
});
window.addEventListener('contextmenu', ev=>{ ev.preventDefault(); setSelected(null); });

function invalidFlash(p){
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.65, 32),
    new THREE.MeshBasicMaterial({color:0xe05555, transparent:true, opacity:0.8, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2;
  ring.position.set(p.x, 0.07, p.z);
  scene.add(ring);
  particles.push({m:ring, vel:v(0,0,0), life:0.4, maxLife:0.4, flat:true});
}
function showRangeRing(t){
  const C = CHARS[t.key];
  const ring = new THREE.Mesh(new THREE.RingGeometry(C.range-0.08, C.range, 48),
    new THREE.MeshBasicMaterial({color:0x7ab0f0, transparent:true, opacity:0.6, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2;
  ring.position.set(t.pos.x, 0.06, t.pos.z);
  scene.add(ring);
  particles.push({m:ring, vel:v(0,0,0), life:1.0, maxLife:1.0, flat:true});
}
function placeTower(p){
  const key = selected, C = CHARS[key], lv = save.roster[key];
  gold -= C.cost;
  const group = C.build();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.82, 0.08, 24), toonMat(C.baseColor));
  base.position.y = 0.04; base.receiveShadow = true;
  group.add(base);
  group.position.set(p.x, 0, p.z);
  scene.add(group);
  towers.push({key, C, lv, dmg:charDmg(key, lv), group, cd:0, pos:v(p.x, 0, p.z), squash:0, spent:C.cost});
  sfx(500, 900, 0.12);
  updateUI();
}
function refundAllTowers(){
  let total = 0;
  for(const t of towers){ total += t.spent; scene.remove(t.group); }
  towers.length = 0;
  gold += total;
  return total;
}

/* ================= 적 ================= */
function makeHpBar(w){
  const g = new THREE.Group();
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.13), new THREE.MeshBasicMaterial({color:0x333344}));
  const fg = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.09), new THREE.MeshBasicMaterial({color:0x4ee06a}));
  fg.position.z = 0.002;
  g.add(bg, fg);
  g.userData = {fg, w};
  return g;
}
function spawnEnemy(typeKey){
  const T = ENEMY_TYPES[typeKey];
  const group = T.build();
  scene.add(group);
  const hpBar = makeHpBar(T.bar);
  scene.add(hpBar);
  const hp = T.boss ? T.hp : Math.round(T.hp * hpMul(wave));
  const reward = Math.round(T.reward * (T.boss ? 1 : rewardMul(wave)));
  enemies.push({type:T, group, hpBar, t:0, hp, maxHp:hp, reward, alive:true, wobT:Math.random()*10, slowT:0, slowF:1});
  if(T.boss){ showBanner(`👑 ${T.name} 등장!!`, 2500); sfx(120, 60, 0.6, 'sawtooth', 0.08); }
}
function removeEnemy(e){
  e.alive = false;
  scene.remove(e.group);
  scene.remove(e.hpBar);
  const i = enemies.indexOf(e);
  if(i >= 0) enemies.splice(i, 1);
}
function damage(e, d){
  if(!e.alive) return;
  e.hp -= d;
  if(e.hp <= 0){
    gold += e.reward;
    burst(e.group.position.clone().add(v(0, 0.7, 0)), 0xfff3a0, e.type.boss ? 24 : 8);
    sfx(420, 90, 0.18, 'square', 0.055);
    removeEnemy(e);
    updateUI();
  }
}
function loseLife(n){
  lives -= n;
  if(lives < 0) lives = 0;
  updateUI(); flash();
  sfx(220, 60, 0.35, 'sawtooth', 0.07);
  if(lives <= 0 && state === 'wave') gameOver(false);
}

/* ================= 발사체 / 파티클 ================= */
function shoot(tw, e){
  const m = new THREE.Mesh(starGeoSmall, projMat(tw.C.projColor));
  m.scale.setScalar(tw.C.projScale);
  m.position.set(tw.pos.x, 1.05, tw.pos.z);
  scene.add(m);
  projectiles.push({m, target:e, last:e.group.position.clone(), dmg:tw.dmg, speed:13,
    splash:tw.C.splash||0, slow:tw.C.slow||0, slowDur:tw.C.slowDur||0});
  tw.squash = 1;
  sfx(tw.C.sfx[0], tw.C.sfx[1], 0.07, 'triangle', 0.03);
}
function applyHit(p){
  const hitPos = p.m.position;
  if(p.splash){
    for(const e of [...enemies]){
      if(!e.alive) continue;
      const d = e.group.position.distanceTo(hitPos);
      if(d <= p.splash) damage(e, e===p.target ? p.dmg : Math.round(p.dmg*0.6));
    }
    ringBurst(hitPos, 0xffb060);
  } else if(p.target && p.target.alive){
    damage(p.target, p.dmg);
  }
  if(p.slow && p.target && p.target.alive){
    p.target.slowT = p.slowDur;
    p.target.slowF = p.slow;
  }
}
function burst(pos, color, n){
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(starGeoTiny, new THREE.MeshBasicMaterial({color, transparent:true}));
    m.position.copy(pos);
    const vel = v((Math.random()-0.5)*3.5, Math.random()*3.2+1.2, (Math.random()-0.5)*3.5);
    particles.push({m, vel, life:0.7, maxLife:0.7});
    scene.add(m);
  }
}
function ringBurst(pos, color){
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.5, 32),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.8, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2;
  ring.position.set(pos.x, 0.1, pos.z);
  scene.add(ring);
  particles.push({m:ring, vel:v(0,0,0), life:0.4, maxLife:0.4, flat:true, grow:true});
}

/* ================= 웨이브 진행 ================= */
function startWave(){
  if(wave >= WAVES.length) return;
  state = 'wave';
  wave++;
  startBtn.classList.add('hidden');
  spawnQueue = [];
  let t = 0.5;
  for(const [type, count, interval] of WAVES[wave-1].list){
    for(let i=0;i<count;i++){
      spawnQueue.push({type, time:t});
      t += interval;
    }
  }
  waveTime = 0;
  showBanner(`🌊 WAVE ${wave} 시작!`);
  sfx(523, 784, 0.25, 'triangle', 0.06);
  updateUI();
}
function waveCleared(){
  if(wave >= WAVES.length){ gameOver(true); return; }
  state = 'idle';
  const isBossWave = WAVES[wave-1].list.some(l=>ENEMY_TYPES[l[0]].boss);
  const gemReward = isBossWave ? 60 : 25;
  gold += 70;
  save.gems += gemReward;
  persist();
  showBanner(`✨ 클리어! ⭐70 + 💎${gemReward}`, 2400);
  jingle([523, 659, 784]);
  // 다음 웨이브가 새 맵이면 이동
  const nextMapIdx = WAVES[wave].map;
  if(nextMapIdx !== currentMap){
    const refund = refundAllTowers();
    setSelected(null);
    buildMap(nextMapIdx);
    setTimeout(()=>showBanner(`🗺️ 새로운 맵: ${MAPS[nextMapIdx].name}! (배치 비용 ⭐${refund} 환급)`, 3000), 1300);
  }
  startBtn.classList.remove('hidden');
  updateUI();
}
function gameOver(win){
  state = win ? 'won' : 'lost';
  startBtn.classList.add('hidden');
  if(win){ save.gems += 200; persist(); }
  const ov = $('overlay'), h = ov.querySelector('h1'), p = ov.querySelector('p'), b = $('overlayBtn');
  if(win){
    h.textContent = '🎉 완전 승리!';
    p.innerHTML = '10개의 웨이브를 모두 막아냈어요!<br>보상으로 💎200 획득!<br>모은 캐릭터들은 다음 판에도 함께합니다 🌟';
    jingle([523, 659, 784, 1047, 1319], 150);
  } else {
    h.textContent = '💔 패배...';
    p.innerHTML = '별을 빼앗기고 말았어요.<br>💎와 컬렉션은 그대로니까, 더 뽑아서 재도전!';
  }
  b.textContent = '다시 도전';
  b.onclick = ()=>location.reload();
  ov.classList.remove('hidden');
}
startBtn.addEventListener('click', ()=>{ ensureAC(); if(state==='idle') startWave(); });
$('overlayBtn').addEventListener('click', ()=>{
  ensureAC();
  $('overlay').classList.add('hidden');
  state = 'idle';
});
$('speedBtn').addEventListener('click', ()=>{
  ensureAC();
  gameSpeed = gameSpeed === 1 ? 2 : 1;
  $('speedBtn').textContent = 'x' + gameSpeed;
});

/* ================= 가챠 ================= */
const PULL_COST1 = 50, PULL_COST5 = 225;
function rollRarity(){
  if(save.pity >= 9){
    save.pity = 0;
    return Math.random() < 0.8 ? 'SR' : 'SSR';
  }
  const r = Math.random()*100;
  let rar;
  if(r < 3) rar = 'SSR';
  else if(r < 15) rar = 'SR';
  else if(r < 45) rar = 'R';
  else rar = 'N';
  if(rar === 'SR' || rar === 'SSR') save.pity = 0;
  else save.pity++;
  return rar;
}
function pullOne(){
  const rar = rollRarity();
  const pool = Object.keys(CHARS).filter(k=>CHARS[k].rar === rar);
  const key = pool[Math.floor(Math.random()*pool.length)];
  const isNew = !save.roster[key];
  let note = '';
  if(isNew){
    save.roster[key] = 1;
    note = 'NEW!';
  } else if(save.roster[key] < 7){
    save.roster[key]++;
    note = `Lv${save.roster[key]}!`;
  } else {
    save.gems += 20;
    note = '💎+20';
  }
  return {key, rar, note, isNew};
}
function doPull(n){
  ensureAC();
  const cost = n === 1 ? PULL_COST1 : PULL_COST5;
  if(save.gems < cost) return;
  save.gems -= cost;
  const results = [];
  for(let i=0;i<n;i++) results.push(pullOne());
  persist();
  const stage = $('gachaStage');
  stage.innerHTML = '<div class="g-star">⭐</div>';
  $('pull1').disabled = true; $('pull5').disabled = true;
  sfx(400, 900, 0.5, 'triangle', 0.05);
  setTimeout(()=>{
    stage.innerHTML = '';
    let bestRank = 0;
    const ranks = {N:0, R:1, SR:2, SSR:3};
    results.forEach((r, i)=>{
      const C = CHARS[r.key], rc = RARITY[r.rar].color;
      bestRank = Math.max(bestRank, ranks[r.rar]);
      const el = document.createElement('div');
      el.className = 'g-result';
      el.style.setProperty('--rc', rc);
      el.style.animationDelay = (i*0.12)+'s';
      el.innerHTML = `${r.note ? `<span class="rnew">${r.note}</span>` : ''}
        <div class="avatar" style="background:${C.css}"></div>
        <div class="rname">${C.name}</div><div class="rrar">${r.rar}</div>`;
      stage.appendChild(el);
    });
    if(bestRank >= 3) jingle([784, 988, 1175, 1568], 110, 0.08);
    else if(bestRank === 2) jingle([659, 784, 988], 120);
    else jingle([523, 659], 130);
    renderCollection();
    rebuildCards();
    updateUI();
  }, 900);
}
function renderCollection(){
  const col = $('collection');
  col.innerHTML = '';
  for(const [key, C] of Object.entries(CHARS)){
    const lv = save.roster[key];
    const el = document.createElement('div');
    el.className = 'col-item' + (lv ? '' : ' locked');
    el.innerHTML = `<div class="avatar" style="background:${C.css}"></div>
      <div class="cn">${lv ? C.name : '???'}</div>
      <div class="cn" style="color:${RARITY[C.rar].color}">${C.rar}${lv ? ' · Lv'+lv : ''}</div>`;
    el.title = lv ? `${C.desc} · 공격력 ${charDmg(key, lv)}` : '아직 못 만난 친구';
    col.appendChild(el);
  }
}
$('gachaBtn').addEventListener('click', ()=>{
  ensureAC();
  gachaOpen = true;
  $('gachaModal').classList.remove('hidden');
  renderCollection();
  updateUI();
});
$('gachaClose').addEventListener('click', ()=>{
  gachaOpen = false;
  $('gachaModal').classList.add('hidden');
});
$('pull1').addEventListener('click', ()=>doPull(1));
$('pull5').addEventListener('click', ()=>doPull(5));
$('resetSave').addEventListener('click', ()=>{
  if(confirm('컬렉션과 💎를 모두 초기화할까요?')){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
});

/* ================= 메인 루프 ================= */
const clock = new THREE.Clock();

function gameUpdate(dt){
  waveTime += dt;
  while(spawnQueue.length && spawnQueue[0].time <= waveTime){
    spawnEnemy(spawnQueue.shift().type);
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.slowT > 0) e.slowT -= dt;
    const spd = e.type.speed * (e.slowT > 0 ? e.slowF : 1);
    e.t += spd * dt / curveLen;
    if(e.t >= 1){ loseLife(e.type.dmgToBase || 1); removeEnemy(e); continue; }
    const p = curve.getPointAt(e.t), tg = curve.getTangentAt(e.t);
    e.wobT += dt;
    e.group.position.set(p.x, (e.type.flyY||0) + Math.abs(Math.sin(e.wobT*7))*0.07, p.z);
    if(e.type.spin){
      e.group.rotation.y += dt*1.6;
    } else {
      e.group.rotation.y = Math.atan2(tg.x, tg.z);
      e.group.rotation.z = Math.sin(e.wobT*9)*0.05;
    }
    if(e.group.userData.wings){
      for(const w of e.group.userData.wings)
        w.rotation.z = w.userData.side * (0.45 + Math.sin(e.wobT*24)*0.45);
    }
    // 감속 표시
    if(e.slowT > 0 && !e.slowMark){
      e.slowMark = new THREE.Mesh(new THREE.SphereGeometry(0.75, 14, 12),
        new THREE.MeshBasicMaterial({color:0x8ab8ff, transparent:true, opacity:0.25}));
      e.slowMark.position.y = 0.6;
      e.group.add(e.slowMark);
    }
    if(e.slowMark) e.slowMark.visible = e.slowT > 0;

    e.hpBar.position.set(p.x, e.group.position.y + e.type.barY, p.z);
    e.hpBar.quaternion.copy(camera.quaternion);
    const r = Math.max(e.hp, 0) / e.maxHp;
    const fg = e.hpBar.userData.fg;
    fg.scale.x = Math.max(r, 0.001);
    fg.position.x = -e.hpBar.userData.w * (1-r) / 2;
    fg.material.color.setHSL(0.33*r, 0.85, 0.5);
  }
  for(const tw of towers){
    tw.cd -= dt;
    let best = null;
    for(const e of enemies){
      if(!e.alive) continue;
      if(tw.pos.distanceTo(e.group.position) <= tw.C.range && (!best || e.t > best.t)) best = e;
    }
    if(best){
      tw.group.rotation.y = Math.atan2(best.group.position.x - tw.pos.x, best.group.position.z - tw.pos.z);
      if(tw.cd <= 0){ tw.cd = tw.C.rate; shoot(tw, best); }
    }
  }
  if(state === 'wave' && !spawnQueue.length && !enemies.length) waveCleared();
}

function animate(){
  requestAnimationFrame(animate);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const dt = rawDt * gameSpeed;
  const t = clock.elapsedTime;

  if(!gachaOpen){
    if(state === 'wave') gameUpdate(dt);

    for(let i=projectiles.length-1;i>=0;i--){
      const p = projectiles[i];
      if(p.target && p.target.alive){
        p.last.copy(p.target.group.position);
        p.last.y += 0.5;
      }
      p.m.rotation.y += 10*dt; p.m.rotation.x += 6*dt;
      const dir = p.last.clone().sub(p.m.position);
      const d = dir.length(), step = p.speed*dt;
      if(d <= step + 0.3){
        applyHit(p);
        burst(p.m.position, 0xffe066, 3);
        scene.remove(p.m);
        projectiles.splice(i, 1);
      } else {
        p.m.position.add(dir.multiplyScalar(step/d));
      }
    }
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ scene.remove(p.m); particles.splice(i, 1); continue; }
      const k = p.life / p.maxLife;
      if(p.flat){
        if(p.grow) p.m.scale.setScalar(1 + (1-k)*3);
        p.m.material.opacity = 0.8 * k;
      } else {
        p.m.position.addScaledVector(p.vel, dt);
        p.vel.y -= 6*dt;
        p.m.material.opacity = k;
        p.m.rotation.z += 8*dt;
      }
    }
    for(const tw of towers){
      if(tw.squash > 0){
        tw.squash = Math.max(0, tw.squash - 4*dt);
        const s = Math.sin(tw.squash * Math.PI) * 0.14;
        tw.group.scale.set(1+s, 1-s, 1+s);
      }
    }
  }
  for(const sp of mapSpinners){ sp.rotation.y += rawDt * 1.2; }
  for(const c of mapClouds){
    c.position.x += rawDt * 0.35;
    if(c.position.x > 16) c.position.x = -16;
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
});

/* 디버그용 상태 조회 */
window.__dbg = ()=>({state, wave, gold, lives, gems:save.gems, towers:towers.length, enemies:enemies.length, map:currentMap, roster:{...save.roster}});

buildMap(0);
rebuildCards();
renderCollection();
updateUI();
animate();
</script>
