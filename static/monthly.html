<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>월간 운영보고 이슈 정리 - MAP</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app-shell"></div>

  <main>
    <!-- 1) 옵션 (개인 계정 저장, 기본 접힘) -->
    <details class="card" id="optCard">
      <summary class="settings-summary">
        <span class="settings-title">⚙️ 정리 옵션 <span class="muted" style="font-weight:400;">— 한 번 저장하면 다음에도 기본값으로 사용</span></span>
        <span class="settings-state muted" id="optState"></span>
      </summary>

      <div class="settings-body">
        <label class="chk">
          <input type="checkbox" id="allClosed" />
          상태를 모두 <b>종료</b>로 표시
        </label>

        <label>담당자 기본값 <span class="hint">(비우면 원본 담당자 유지)</span></label>
        <input type="text" id="defaultAssignee" placeholder="예) 오지웅, 박세희" />

        <div class="row">
          <div>
            <label>보고 월 표기 <span class="hint">(예: 05월)</span></label>
            <input type="text" id="reportMonth" placeholder="예) 05월" />
          </div>
          <div>
            <label>1 M/M 환산 일수 <span class="hint">(기본 20)</span></label>
            <input type="text" id="mdPerMm" placeholder="20" />
          </div>
        </div>

        <label>요약·Insight 작성 가이드 <span class="hint">(AI 톤/관점 지정 — 선택)</span></label>
        <textarea id="guidePrompt" style="min-height:90px;" placeholder="예)
- 정량 지표(건수/시간) 위주
- 리스크·재발방지 관점 강조
- 개조식, 명사형 종결"></textarea>

        <div class="actions">
          <button id="saveOpt">💾 옵션 저장</button>
        </div>
        <div id="optStatus"></div>
      </div>
    </details>

    <!-- 2) 파일 업로드 -->
    <div class="card">
      <h2>Jira export 파일 업로드</h2>
      <p class="muted">Jira에서 export 한 <b>.xls</b> 또는 <b>.csv</b> 파일을 올리세요. 키·요약·상태·담당자·작업한 시간·레이블을 자동 인식합니다.</p>

      <div id="fileDrop" class="dropzone">
        여기로 파일을 드래그하거나 클릭해서 선택 (.xls / .csv)
        <input type="file" id="fileInput" accept=".xls,.xlsx,.csv,text/csv,application/vnd.ms-excel" hidden />
      </div>
      <div id="fileName" class="muted" style="margin-top:8px;"></div>

      <label class="chk" style="margin-top:14px;">
        <input type="checkbox" id="withAi" checked />
        주요 업무 요약 · 운영 Insight를 AI로 생성
      </label>

      <div class="actions">
        <button id="generate">⚙️ 생성</button>
        <button class="secondary" id="reset" type="button">초기화</button>
      </div>
      <div id="genStatus"></div>
    </div>

    <!-- 3) 결과 -->
    <div id="resultArea" style="display:none;">
      <!-- 3-1) 가공 결과 + 다운로드 -->
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <h2 style="margin:0;">정리 결과 <span class="muted" style="font-weight:400;">(<span id="rowCount">0</span>건)</span></h2>
          <button id="download" type="button">⬇️ xls 다운로드</button>
        </div>
        <div class="table-wrap" style="margin-top:12px;">
          <table class="result-table" id="resultTable">
            <thead><tr><th>이슈</th><th>비고</th><th>상태</th><th>M/D</th><th>담당자</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 3-2) PPT 붙여넣기용 -->
      <div class="card">
        <h2>운영보고 PPT 붙여넣기용 내용 <span class="muted" style="font-weight:400;">— 표/텍스트를 복사해 PPT에 붙여넣으세요</span></h2>

        <h3 class="block-title">업무 현황 통계 <span class="muted" id="mmSummary"></span></h3>
        <div id="statsBox"></div>
        <div class="actions">
          <button class="secondary" id="copyStats" type="button">📋 통계표 복사</button>
        </div>

        <h3 class="block-title">주요 업무 요약</h3>
        <div id="summaryBox" class="ppt-block"></div>

        <h3 class="block-title">장애예방 / 운영 Insight</h3>
        <div id="insightBox" class="ppt-block"></div>

        <div class="actions">
          <button class="secondary" id="copyText" type="button">📋 요약·Insight 텍스트 복사</button>
        </div>
        <div id="copyStatus"></div>
        <div id="aiError"></div>
      </div>
    </div>
  </main>

  <script src="/static/auth.js"></script>
  <script>
    renderShell({
      context: {
        icon: "🗂️",
        title: "월간 운영보고 이슈 정리",
        actions: [{ label: "📊 주간 보고", href: "/tools/weekly" }],
      },
    });
  </script>
  <script src="/static/monthly.js"></script>
</body>
</html>
